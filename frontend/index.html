<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Yolanda – La marketplace camerounaise de mode de seconde main. Achetez et vendez des vêtements entre particuliers, sans commission." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>Yolanda – Mode de seconde main au Cameroun</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="yolanda-errors" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#1a1a1a;color:#ef4444;z-index:99999;padding:20px;font-family:monospace;overflow:auto;white-space:pre-wrap;"></div>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('yolanda-errors');
        el.style.display = 'block';
        el.textContent = 'ERROR: ' + (e.message || e.error || 'Unknown') + '\n\n' + (e.error && e.error.stack || '');
        document.getElementById('root').style.display = 'none';
        return false;
      });
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('yolanda-errors');
        el.style.display = 'block';
        el.textContent = 'UNHANDLED PROMISE: ' + (e.reason?.message || e.reason || 'Unknown') + '\n\n' + (e.reason?.stack || '');
        document.getElementById('root').style.display = 'none';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
